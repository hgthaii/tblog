name: Deploy to cPanel

on:
  push:
    branches:
      - master
  repository_dispatch:
    types:
      - content_updated
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tblog-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'repository_dispatch' ||
      github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      NEXT_PUBLIC_BASE_PATH: ${{ vars.NEXT_PUBLIC_BASE_PATH }}
      NEXT_PUBLIC_LOCALE: ${{ vars.NEXT_PUBLIC_LOCALE }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_CV_PDF: ${{ vars.NEXT_PUBLIC_CV_PDF }}
      NEXT_PUBLIC_CONTACT_EMAIL: ${{ vars.NEXT_PUBLIC_CONTACT_EMAIL }}
      NEXT_PUBLIC_PROFILE_AVATAR: ${{ vars.NEXT_PUBLIC_PROFILE_AVATAR }}
      NEXT_PUBLIC_SOCIAL_IMAGE: ${{ vars.NEXT_PUBLIC_SOCIAL_IMAGE }}
      NEXT_PUBLIC_FAVICON: ${{ vars.NEXT_PUBLIC_FAVICON }}
      NEXT_PUBLIC_GITHUB_URL: ${{ vars.NEXT_PUBLIC_GITHUB_URL  }}
      NEXT_PUBLIC_INSTAGRAM_URL: ${{ vars.NEXT_PUBLIC_INSTAGRAM_URL }}
      NEXT_PUBLIC_LINKEDIN_URL: ${{ vars.NEXT_PUBLIC_LINKEDIN_URL }}

    steps:
      - name: Checkout template
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Checkout private content
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ vars.PRIVATE_CONTENT_REPOSITORY }}
          ref: ${{ github.event.client_payload.content_sha || 'master' }}
          token: ${{ secrets.PRIVATE_CONTENT_TOKEN }}
          path: .private-content
          persist-credentials: false

      - name: Apply private content
        run: |
          TBL_PRIVATE_LOCALE="${NEXT_PUBLIC_LOCALE:-en}"

          test -f ".private-content/content/locales/${TBL_PRIVATE_LOCALE}.json"
          test -d .private-content/content/posts

          rsync --archive .private-content/content/locales/ content/locales/
          rsync --archive --delete .private-content/content/posts/ content/posts/
          if [ -d .private-content/public ]; then
            rsync --archive .private-content/public/ public/
          fi

          TBL_CONTENT_SHA="$(git -C .private-content rev-parse HEAD)"
          echo "TBL_CONTENT_SHA=$TBL_CONTENT_SHA" >> "$GITHUB_ENV"

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.25.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create CI env file
        run: |
          {
            echo "NEXT_PUBLIC_BASE_PATH=$NEXT_PUBLIC_BASE_PATH"
            echo "NEXT_PUBLIC_LOCALE=$NEXT_PUBLIC_LOCALE"
            echo "NEXT_PUBLIC_SITE_URL=$NEXT_PUBLIC_SITE_URL"
            echo "NEXT_PUBLIC_CV_PDF=$NEXT_PUBLIC_CV_PDF"
            echo "NEXT_PUBLIC_CONTACT_EMAIL=$NEXT_PUBLIC_CONTACT_EMAIL"
            echo "NEXT_PUBLIC_PROFILE_AVATAR=$NEXT_PUBLIC_PROFILE_AVATAR"
            echo "NEXT_PUBLIC_SOCIAL_IMAGE=$NEXT_PUBLIC_SOCIAL_IMAGE"
            echo "NEXT_PUBLIC_FAVICON=$NEXT_PUBLIC_FAVICON"
            echo "NEXT_PUBLIC_GITHUB_URL=$NEXT_PUBLIC_GITHUB_URL"
            echo "NEXT_PUBLIC_INSTAGRAM_URL=$NEXT_PUBLIC_INSTAGRAM_URL"
            echo "NEXT_PUBLIC_LINKEDIN_URL=$NEXT_PUBLIC_LINKEDIN_URL"
          } > .env.local

      - name: Build static site
        run: |
          if [ -n "$NEXT_PUBLIC_BASE_PATH" ]; then
            pnpm build:path
          else
            pnpm build
          fi

      - name: Version and package static output
        run: |
          TBL_VERSION_BASE="$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')")"
          TBL_RELEASE_VERSION="v${TBL_VERSION_BASE}.${GITHUB_RUN_NUMBER}"
          TBL_PACKAGE_NAME="tblog-${TBL_RELEASE_VERSION}.tar.gz"
          TBL_BUILT_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          {
            printf '{\n'
            printf '  "version": "%s",\n' "$TBL_RELEASE_VERSION"
            printf '  "commit": "%s",\n' "$GITHUB_SHA"
            printf '  "contentCommit": "%s",\n' "$TBL_CONTENT_SHA"
            printf '  "builtAt": "%s"\n' "$TBL_BUILT_AT"
            printf '}\n'
          } > out/version.json

          mkdir -p release
          tar -czf "release/$TBL_PACKAGE_NAME" -C out .
          (
            cd release
            sha256sum "$TBL_PACKAGE_NAME" > "$TBL_PACKAGE_NAME.sha256"
          )

          echo "TBL_RELEASE_VERSION=$TBL_RELEASE_VERSION" >> "$GITHUB_ENV"
          echo "TBL_PACKAGE_NAME=$TBL_PACKAGE_NAME" >> "$GITHUB_ENV"

      - name: Prepare immutable assets
        run: |
          mkdir -p deploy-assets/_next
          cp -R out/_next/static deploy-assets/_next/static
          for asset in out/*.png out/*.jpg out/*.jpeg out/*.webp out/*.svg out/*.ico out/*.pdf; do
            if [ -f "$asset" ]; then
              cp "$asset" deploy-assets/
            fi
          done

      - name: Upload assets before pages
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          port: ${{ vars.FTP_PORT || '21' }}
          local-dir: ./deploy-assets/
          server-dir: ${{ vars.FTP_TARGET_DIR }}
          state-name: .ftp-assets-${{ github.run_id }}.json
          log-level: minimal
          exclude: |
            **/.DS_Store

      - name: Upload pages and metadata last
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          port: ${{ vars.FTP_PORT || '21' }}
          local-dir: ./out/
          server-dir: ${{ vars.FTP_TARGET_DIR }}
          state-name: .ftp-deploy-sync-state.json
          exclude: |
            **/.DS_Store
            **/_next/static/**

      - name: Verify production SEO files
        run: |
          TBL_SITE_URL="${NEXT_PUBLIC_SITE_URL%/}"
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error "$TBL_SITE_URL/robots.txt" | grep --fixed-strings "Sitemap: $TBL_SITE_URL/sitemap.xml"; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              exit 1
            fi
            sleep 3
          done
          curl --fail --silent --show-error "$TBL_SITE_URL/sitemap.xml" | grep --fixed-strings "$TBL_SITE_URL/blog/"
          curl --fail --silent --show-error "$TBL_SITE_URL/blog/" | grep --fixed-strings "rel=\"canonical\" href=\"$TBL_SITE_URL/blog/\""
          curl --fail --silent --show-error --head "$TBL_SITE_URL/og-image.png"
          curl --fail --silent --show-error "$TBL_SITE_URL/version.json" | grep --fixed-strings "\"version\": \"$TBL_RELEASE_VERSION\""

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TBL_RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $TBL_RELEASE_VERSION already exists; keeping the existing immutable release."
          else
            gh release create "$TBL_RELEASE_VERSION" \
              "release/$TBL_PACKAGE_NAME#Static site package" \
              "release/$TBL_PACKAGE_NAME.sha256#SHA-256 checksum" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "tblog $TBL_RELEASE_VERSION" \
              --generate-notes \
              --latest
          fi

          TBL_RELEASE_URL="$(gh release view "$TBL_RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --json url --jq '.url')"
          echo "TBL_RELEASE_URL=$TBL_RELEASE_URL" >> "$GITHUB_ENV"

      - name: Notify Telegram after successful deploy
        if: ${{ success() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram notification is not configured; skipping."
            exit 0
          fi

          TBL_SITE_URL="${NEXT_PUBLIC_SITE_URL%/}"
          TBL_COMMIT_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"

          html_escape() {
            printf '%s' "$1" |
              sed \
                -e 's/&/\&amp;/g' \
                -e 's/</\&lt;/g' \
                -e 's/>/\&gt;/g' \
                -e 's/"/\&quot;/g'
          }

          TBL_SITE_URL_HTML="$(html_escape "$TBL_SITE_URL")"
          TBL_COMMIT_URL_HTML="$(html_escape "$TBL_COMMIT_URL")"
          TBL_RELEASE_URL_HTML="$(html_escape "$TBL_RELEASE_URL")"
          TBL_RELEASE_VERSION_HTML="$(html_escape "$TBL_RELEASE_VERSION")"
          TBL_BRANCH_HTML="$(html_escape "$GITHUB_REF_NAME")"
          TBL_COMMIT_SHA_HTML="$(html_escape "${GITHUB_SHA::7}")"
          TBL_CONTENT_SHA_HTML="$(html_escape "${TBL_CONTENT_SHA::7}")"
          TBL_ACTOR_HTML="$(html_escape "$GITHUB_ACTOR")"

          TBL_MESSAGE="<b>✅ DEPLOYMENT COMPLETED</b>

          🚀 <b>Version:</b> <code>${TBL_RELEASE_VERSION_HTML}</code>
          🌐 <b>Site:</b> <a href=\"${TBL_SITE_URL_HTML}\">${TBL_SITE_URL_HTML}</a>
          🌿 <b>Branch:</b> <code>${TBL_BRANCH_HTML}</code>
          📌 <b>Commit SHA:</b> <a href=\"${TBL_COMMIT_URL_HTML}\">${TBL_COMMIT_SHA_HTML}</a>
          📦 <b>Content SHA:</b> <code>${TBL_CONTENT_SHA_HTML}</code>
          👤 <b>Triggered by:</b> <code>${TBL_ACTOR_HTML}</code>
          🏷️ <b>Release:</b> <a href=\"${TBL_RELEASE_URL_HTML}\">View release</a>"

          TBL_TELEGRAM_RESPONSE="$(mktemp)"
          trap 'rm -f "$TBL_TELEGRAM_RESPONSE"' EXIT

          if ! curl --fail-with-body --silent --show-error \
            --output "$TBL_TELEGRAM_RESPONSE" \
            --retry 3 \
            --request POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${TBL_MESSAGE}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "disable_web_page_preview=true"; then
            node -e '
              const fs = require("fs");
              try {
                const response = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
                console.error(`Telegram API: ${response.description || "Unknown error"}`);
              } catch {
                console.error("Telegram API returned an unreadable error response.");
              }
            ' "$TBL_TELEGRAM_RESPONSE"
            exit 1
          fi
