name: Trigger tblog deployment

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trigger-tblog-deployment
  cancel-in-progress: true

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch content revision to tblog
        env:
          GH_TOKEN: ${{ secrets.TBLOG_DISPATCH_TOKEN }}
          CONTENT_SHA: ${{ github.sha }}
        run: |
          test -n "$GH_TOKEN"

          curl --fail --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/hgthaii/tblog/dispatches \
            --data "{\"event_type\":\"content_updated\",\"client_payload\":{\"content_sha\":\"$CONTENT_SHA\"}}"
