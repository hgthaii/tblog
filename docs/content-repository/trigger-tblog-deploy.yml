name: Trigger tblog deployment

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trigger-tblog-deployment
  cancel-in-progress: true

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout content
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate content
        run: |
          test -d content/locales
          test -d content/posts

          find content/locales -maxdepth 1 -name '*.json' -print -quit |
            grep --quiet .

          for locale_file in content/locales/*.json; do
            node -e \
              "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'))" \
              "$locale_file"
          done

      - name: Dispatch content revision to tblog
        env:
          GH_TOKEN: ${{ secrets.TBLOG_DISPATCH_TOKEN }}
          TBLOG_REPOSITORY: ${{ vars.TBLOG_REPOSITORY }}
          CONTENT_SHA: ${{ github.sha }}
        run: |
          test -n "$GH_TOKEN"
          test -n "$TBLOG_REPOSITORY"

          curl --fail --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${TBLOG_REPOSITORY}/dispatches" \
            --data "{\"event_type\":\"content_updated\",\"client_payload\":{\"content_sha\":\"$CONTENT_SHA\"}}"
