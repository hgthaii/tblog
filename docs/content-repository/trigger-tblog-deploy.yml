name: Trigger tblog deployment

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trigger-tblog-deployment
  cancel-in-progress: true

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout content
        uses: actions/checkout@v5

      - name: Validate content
        run: |
          test -f content/locales/vi.json
          test -d content/posts
          node -e "JSON.parse(require('fs').readFileSync('content/locales/vi.json', 'utf8'))"

      - name: Dispatch content revision to tblog
        env:
          GH_TOKEN: ${{ secrets.TBLOG_DISPATCH_TOKEN }}
          TBLOG_REPOSITORY: ${{ vars.TBLOG_REPOSITORY }}
          CONTENT_SHA: ${{ github.sha }}
        run: |
          test -n "$GH_TOKEN"
          test -n "$TBLOG_REPOSITORY"

          curl --fail --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${TBLOG_REPOSITORY}/dispatches" \
            --data "{\"event_type\":\"content_updated\",\"client_payload\":{\"content_sha\":\"$CONTENT_SHA\"}}"
